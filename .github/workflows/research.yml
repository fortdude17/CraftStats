# Temporary: used during porting to look up dependency versions and the
# Minecraft 1.21.11 API. Safe to delete.
name: Research
on:
  push:
    paths: ['.github/research/**', '.github/workflows/research.yml']
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: current }
      - run: bash .github/research/run.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: research
          path: research-out/
          if-no-files-found: ignore
