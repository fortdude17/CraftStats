modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/fortdude17/CraftStats/issues"

[[mods]]
    modId = "craftstats"
    version = "${version}"
    displayName = "CraftStats!"
    logoFile = "icon.png"
    description = '''
Universal in-game stats editor for mobs, blocks, items and players.
Right-click with the Craft Wand to open the stat editor GUI.
'''
    displayURL = "https://github.com/fortdude17/CraftStats"
    authors = "Fortdude21"

[[dependencies.craftstats]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoforge_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.craftstats]]
    modId = "minecraft"
    type = "required"
    versionRange = "${neoforge_minecraft_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.craftstats]]
    modId = "architectury"
    type = "required"
    versionRange = "${architectury_range}"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "craftstats-common.mixins.json"
