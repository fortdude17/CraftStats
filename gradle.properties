org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=false
org.gradle.caching=true

mod_version=1.1.2
maven_group=com.craftstats
archives_base_name=craftstats
enabled_platforms=fabric,neoforge

# Minecraft version to build. Override on the command line: ./gradlew build -Pmc=1.21.11
# Supported versions are the files in versions/.
mc=1.21.1
# The version the checked-in sources are written for (see gradle/preprocess.gradle).
base_mc=1.21.1
