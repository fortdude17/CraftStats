plugins {
    id "architectury-plugin"
    id "dev.architectury.loom" apply false
    id "com.gradleup.shadow" apply false
}

apply from: "gradle/preprocess.gradle"

// ---------------------------------------------------------------------------
// Version selection: ./gradlew build -Pmc=1.21.11  (default comes from gradle.properties)
// Every per-version value lives in versions/<mc>.properties.
// ---------------------------------------------------------------------------
def versionProps = new Properties()
file("versions/${mc}.properties").withInputStream { versionProps.load(it) }
versionProps.each { k, v -> if (!k.startsWith("rename.")) ext.set(k, v) }
ext.sourceRenames = versionProps.findAll { k, v -> k.startsWith("rename.") }
        .collectEntries { k, v -> [(k - "rename."): v] }

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = "${rootProject.mod_version}+${rootProject.minecraft_version}"
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    repositories {
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.terraformersmc.com/releases" }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    // Gradle 8.2+ marks runtimeClasspath as non-declarable; architectury-plugin still adds to it.
    configurations.all {
        if (name == "runtimeClasspath") setCanBeDeclared(true)
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.toVersion(rootProject.java_version)
        targetCompatibility = JavaVersion.toVersion(rootProject.java_version)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = rootProject.java_version as int
    }

    // Values substituted into fabric.mod.json / neoforge.mods.toml.
    def metadata = [
            version                 : project.version,
            fabric_minecraft_range  : rootProject.fabric_minecraft_range,
            fabric_loader_version   : rootProject.fabric_loader_version,
            architectury_version    : rootProject.architectury_version,
            neoforge_minecraft_range: rootProject.neoforge_minecraft_range,
            neoforge_range          : rootProject.neoforge_range,
            architectury_range      : rootProject.architectury_range,
    ]
    processResources {
        inputs.properties(metadata)
        filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml"]) {
            expand(metadata)
        }
    }

    // Sources are written for `base_mc`; any other version builds from a preprocessed copy.
    if (rootProject.mc != rootProject.base_mc) {
        def srcDir = file("src/main/java")
        def outDir = layout.buildDirectory.dir("preprocessed/java")
        def targetMc = rootProject.minecraft_version
        def renames = rootProject.sourceRenames
        def preprocess = tasks.register("preprocessJava") {
            inputs.dir(srcDir)
            inputs.property("mc", targetMc)
            inputs.property("renames", renames.toString())
            outputs.dir(outDir)
            doLast {
                def out = outDir.get().asFile
                project.delete(out)
                fileTree(srcDir).each { File f ->
                    def rel = srcDir.toPath().relativize(f.toPath()).toString()
                    def target = new File(out, rel)
                    target.parentFile.mkdirs()
                    target.setText(rootProject.preprocessSource(f.getText("UTF-8"), targetMc, renames, rel), "UTF-8")
                }
            }
        }
        sourceSets.main.java.setSrcDirs([preprocess])
    }
}
