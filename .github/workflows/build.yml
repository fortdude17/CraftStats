name: Build

on:
  push:
    paths-ignore: ['.github/research/**', '.github/workflows/research.yml', '**.md']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '1.21.11']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace

      - name: Collect jars
        run: |
          mkdir -p dist
          for loader in fabric neoforge; do
            for jar in "$loader"/build/libs/*.jar; do
              case "$jar" in *-dev*|*-sources*) continue ;; esac
              cp "$jar" dist/
            done
          done
          ls -l dist

      - uses: actions/upload-artifact@v5
        with:
          name: craftstats-mc${{ matrix.mc }}
          path: dist/*.jar
          if-no-files-found: error
