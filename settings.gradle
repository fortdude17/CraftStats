pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases" }
        gradlePluginPortal()
    }

    // Plugin versions depend on the Minecraft version being built (-Pmc=...).
    def rootProps = new Properties()
    file("gradle.properties").withInputStream { rootProps.load(it) }
    def mc = startParameter.projectProperties.get("mc") ?: rootProps.getProperty("mc")
    def versionFile = file("versions/${mc}.properties")
    if (!versionFile.exists()) {
        throw new GradleException("Unsupported Minecraft version '${mc}'. Available: " +
                file("versions").list().findAll { it.endsWith(".properties") }
                        .collect { it - ".properties" }.sort().join(", "))
    }
    def versionProps = new Properties()
    versionFile.withInputStream { versionProps.load(it) }

    resolutionStrategy {
        eachPlugin {
            switch (requested.id.id) {
                case "dev.architectury.loom": useVersion(versionProps.getProperty("loom_version")); break
                case "architectury-plugin":   useVersion(versionProps.getProperty("architectury_plugin_version")); break
                case "com.gradleup.shadow":   useVersion(versionProps.getProperty("shadow_version")); break
            }
        }
    }
}

rootProject.name = "craftstats"
include("common", "fabric", "neoforge")
