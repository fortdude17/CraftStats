name: API probe

# Temporary: prints Minecraft 1.21.11 class signatures to the log (development aid).
on:
  push:
    paths: ['.github/workflows/probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group:
          - "BlockStateBase InteractionResult RegistryAccess CommandSourceStack Repairable SimpleSoundInstance"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Set up Minecraft 1.21.11
        run: |
          chmod +x gradlew
          ./gradlew :common:compileJava -Pmc=1.21.11 --console=plain -q > /dev/null 2>&1 || true
      - name: Dump signatures
        env:
          NAMES: ${{ matrix.group }}
        run: |
          MC=$(find . ~/.gradle -name 'minecraft-merged-*1.21.11*.jar' ! -name '*sources*' 2>/dev/null | head -1)
          unzip -Z1 "$MC" | grep '\.class$' > mc.txt
          for n in $NAMES; do
            for c in $(grep -E "[/\$]${n}\.class$" mc.txt | head -2); do
              echo "########## $c"
              javap -p -cp "$MC" "${c%.class}" 2>&1 | grep -v '^Compiled from' | grep -v 'EntityDataAccessor' | cut -c1-400
            done
          done
