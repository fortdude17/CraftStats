name: Build

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', '.github/workflows/probe.yml']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '1.21.11']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace

      - name: Collect jars
        run: |
          mkdir -p dist
          for loader in fabric neoforge; do
            for jar in "$loader"/build/libs/*.jar; do
              case "$jar" in *-dev*|*-sources*) continue ;; esac
              cp "$jar" dist/
            done
          done
          ls -l dist

      - uses: actions/upload-artifact@v5
        with:
          name: craftstats-mc${{ matrix.mc }}
          path: dist/*.jar
          if-no-files-found: error

      - name: Smoke test (boot a dedicated server on each loader)
        run: |
          failed=0
          for loader in fabric neoforge; do
            mkdir -p "$loader/run"
            echo "eula=true" > "$loader/run/eula.txt"
            printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > "$loader/run/server.properties"
            timeout 900 ./gradlew ":$loader:runServer" -Pmc=${{ matrix.mc }} -PsmokeTest --console=plain > "smoke-$loader.log" 2>&1 || true
            grep -E "smoke test:|CRAFTSTATS-SMOKE|Mixin apply|InvalidInjection|MixinApplyError|Exception" "smoke-$loader.log" | head -60 || true
            if grep -q "CRAFTSTATS-SMOKE-PASS" "smoke-$loader.log"; then
              echo "$loader smoke test passed"
            else
              echo "::error::$loader smoke test failed on ${{ matrix.mc }}"
              tail -150 "smoke-$loader.log"
              failed=1
            fi
          done
          exit $failed

      - name: Client smoke test (start the game under a virtual display)
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick > /dev/null
          failed=0
          mkdir -p shots
          for loader in fabric neoforge; do
            mkdir -p "$loader/run"
            Xvfb :99 -screen 0 854x480x24 > /dev/null 2>&1 &
            xvfb=$!
            export DISPLAY=:99
            shots=""
            [ "$loader" = fabric ] && shots="-Pscreenshots"
            timeout 600 ./gradlew ":$loader:runClient" -Pmc=${{ matrix.mc }} -PsmokeTest $shots --console=plain > "client-$loader.log" 2>&1 &
            game=$!
            # The test creates screenshot-<name>.req files and waits until they are gone.
            while kill -0 $game 2>/dev/null; do
              for req in $(find fabric/run neoforge/run -maxdepth 1 -name 'screenshot-*.req' 2>/dev/null); do
                sleep 1
                name=$(basename "$req" .req)
                import -display :99 -window root "shots/${name#screenshot-}.png" 2>/dev/null || true
                rm -f "$req"
              done
              sleep 1
            done
            kill $xvfb 2>/dev/null || true
            grep -E "smoke test:|CRAFTSTATS-CLIENT-SMOKE|Mixin apply|InvalidInjection|MixinApplyError|Exception|Crash" "client-$loader.log" | head -80 || true
            if grep -q "CRAFTSTATS-CLIENT-SMOKE-PASS" "client-$loader.log"; then
              echo "$loader client smoke test passed"
            else
              echo "::error::$loader client smoke test failed on ${{ matrix.mc }}"
              tail -150 "client-$loader.log"
              failed=1
            fi
          done
          # Screenshots go into the log as base64 so they can be looked at without artifacts.
          for f in shots/*.png; do
            [ -e "$f" ] || continue
            convert "$f" -quality 85 "${f%.png}.jpg"
            echo "SCREENSHOT-BEGIN $(basename "${f%.png}")"
            base64 -w 0 "${f%.png}.jpg"
            echo
            echo "SCREENSHOT-END"
          done
          exit $failed
